title: Updates
columns:
  main:
    width: 2/3
    sections:
      updates:
        type: pages
        headline: Updates
        template: update
        status: all
        sortBy: date desc
        layout: cards
        size: small
        empty: Nog geen updates. Klik op "Toevoegen" om de eerste te maken.
        info: "{{ page.date.toDate('d-m-Y') }}"
        image:
          query: page.thumbnail
          cover: true
          ratio: 4/3
  sidebar:
    width: 1/3
    fields:
      text:
        label: Introductie
        type: textarea
