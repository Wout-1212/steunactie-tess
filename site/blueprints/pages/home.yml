title: Home
options:
  changeSlug: false
  changeStatus: false
  delete: false
# Tabs follow the homepage from top to bottom.
tabs:
  hero:
    label: Hero
    icon: home
    columns:
      main:
        width: 2/3
        fields:
          hero_kicker:
            label: Bovenschrift
            type: text
          hero_title:
            label: Hoofdtitel
            type: text
          hero_text:
            label: Intro onder de hoofdtitel
            type: textarea
            buttons: false
      sidebar:
        width: 1/3
        fields:
          hero_image:
            extends: fields/photo
            label: Foto
  story:
    label: Over Tess
    icon: user
    columns:
      main:
        width: 2/3
        fields:
          story_title:
            label: Titel
            type: text
          story_text:
            label: Tekst
            type: textarea
            size: large
      sidebar:
        width: 1/3
        fields:
          story_image:
            extends: fields/photo
            label: Foto
  journey:
    label: Traject
    icon: flag
    columns:
      main:
        width: 2/3
        fields:
          journey_info:
            label: Stappen en weegschaal
            type: info
            text: De stappen van de tijdlijn en alles van de weegschaal (titel, uitleg en stappen) pas je aan bij [Traject](/panel/site?tab=journey). Hier staan alleen de titel, inleiding en foto van de tijdlijn.
          treatment_title:
            label: Titel tijdlijn
            type: text
          treatment_intro:
            label: Inleiding tijdlijn (optioneel)
            type: textarea
            buttons: false
      sidebar:
        width: 1/3
        fields:
          treatment_image:
            extends: fields/photo
            label: Foto bij de tijdlijn (optioneel)
  donate:
    label: Doneren
    icon: heart
    fields:
      progress_info:
        label: Voortgangsbalk
        type: info
        text: Titel, bedragen en mijlpalen van de voortgangsbalk staan bij [Donaties](/panel/site?tab=donations).
      contribute_title:
        label: Titel manieren om bij te dragen
        type: text
      contribute_cards:
        label: Kaarten
        type: structure
        columns:
          title: true
          action: true
        fields:
          action:
            label: Actie bij klikken
            type: select
            required: true
            options:
              donate: Naar het donatieblok
              share: Pagina delen
              contact: Naar het contactformulier
          icon:
            label: Icoon
            type: select
            options:
              heart: Hart (doneren)
              share: Delen
              megaphone: Megafoon (actie)
              building: Gebouw (bedrijf)
          title:
            label: Titel
            type: text
          text:
            label: Tekst
            type: text
      donation_title:
        label: Titel donatieblok
        type: text
      donation_text:
        label: Tekst donatieblok
        type: textarea
        buttons: false
      featured_amount:
        label: Bedrag met label Meest gekozen
        type: select
        default: '50'
        required: true
        translate: false
        help: Handmatige keuze; dit label gebruikt geen donatiestatistieken.
        options:
          '10': '€ 10'
          '25': '€ 25'
          '50': '€ 50'
          '100': '€ 100'
      messages_title:
        label: Titel donatiemuur
        type: text
        placeholder: Recente donaties
        help: De muur staat naast het donatieblok zodra online doneren via Mollie aanstaat, met de laatste 10 donaties en een knop naar alle donaties. Berichten beheer je bij Donaties in het menu links.
      messages_intro:
        label: Inleiding donatiemuur (optioneel)
        type: textarea
        buttons: false
  contact:
    label: Updates & contact
    icon: email
    fields:
      updates_title:
        label: Titel updates
        type: text
        help: De drie nieuwste gepubliceerde updates worden getoond. Updates schrijf je bij [Updates](/panel/site?tab=updates).
      contact_kicker:
        label: Bovenschrift contact
        type: text
        width: 1/2
      contact_title:
        label: Titel contact
        type: text
        width: 1/2
      contact_text:
        label: Intro contact
        type: textarea
        buttons: false
  meta: tabs/menu-seo
