title: Home
options:
  changeStatus: false
  delete: false
tabs:
  hero:
    label: Hero
    columns:
      main:
        width: 2/3
        fields:
          hero_kicker:
            label: Bovenschrift
            type: text
          hero_title:
            label: Hoofdtitel
            type: text
          hero_text:
            label: Intro onder de hoofdtitel
            type: textarea
      sidebar:
        width: 1/3
        fields:
          hero_image:
            label: Foto
            type: files
            multiple: false
            uploads: image
            translate: false
  story:
    label: Over Tess
    columns:
      main:
        width: 2/3
        fields:
          story_title:
            label: Titel
            type: text
          story_text:
            label: Tekst
            type: textarea
            size: large
      sidebar:
        width: 1/3
        fields:
          story_image:
            label: Foto
            type: files
            multiple: false
            uploads: image
            translate: false
  donate:
    label: Doneren
    fields:
      progress_title:
        label: Titel boven de voortgangsbalk
        type: text
        help: Bedragen en mijlpalen staan bij Site-instellingen.
      donation_title:
        label: Titel donatieblok
        type: text
      donation_text:
        label: Tekst donatieblok
        type: textarea
      featured_amount:
        label: Bedrag met label Meest gekozen
        type: select
        default: '50'
        required: true
        translate: false
        help: Handmatige keuze; dit label gebruikt geen donatiestatistieken.
        options:
          '10': '€ 10'
          '25': '€ 25'
          '50': '€ 50'
          '100': '€ 100'
  contribute:
    label: Bijdragen
    fields:
      contribute_title:
        label: Titel
        type: text
      contribute_cards:
        label: Kaarten
        type: structure
        columns:
          title: true
          action: true
        fields:
          action:
            label: Actie bij klikken
            type: select
            required: true
            options:
              donate: Naar het donatieblok
              share: Pagina delen
              contact: Naar het contactformulier
          icon:
            label: Icoon
            type: select
            options:
              heart: Hart (doneren)
              share: Delen
              megaphone: Megafoon (actie)
              building: Gebouw (bedrijf)
          title:
            label: Titel
            type: text
          text:
            label: Tekst
            type: text
  treatment:
    label: Updates & traject
    columns:
      main:
        width: 2/3
        fields:
          treatment_title:
            label: Titel traject
            type: text
          treatment_intro:
            label: Inleiding traject (optioneel)
            type: textarea
            buttons: false
          treatment_steps:
            label: Stappen van het traject
            type: structure
            help: Wordt als tijdlijn op de homepage getoond. Met de status zie je waar Tess nu staat.
            columns:
              heading: true
              status: true
            fields:
              heading:
                label: Stap
                type: text
              status:
                label: Status (optioneel)
                type: select
                options:
                  done: Afgerond
                  current: Nu bezig
                  upcoming: Nog te komen
              text:
                label: Korte toelichting (optioneel)
                type: text
          medical_title:
            label: Titel medische weegschaal
            type: text
            placeholder: Waar gaat jouw steun naartoe?
          medical_intro:
            label: Uitleg medische weegschaal
            type: textarea
          medical_steps:
            label: Medische vooruitgang
            type: structure
            help: Alleen bevestigde behandelingen invoeren. Dit staat los van opgehaalde donaties. Bestaande trajectstappen blijven behouden.
            columns:
              heading: true
              status: true
              weight: true
            fields:
              heading:
                label: Onderzoek of behandeling
                type: text
                required: true
              status:
                label: Status
                type: select
                required: true
                options:
                  done: Al gedaan
                  planned: Nog te doen
              weight:
                label: Gewicht op de weegschaal
                type: number
                default: 1
                min: 1
                step: 1
                help: Gelijke gewichten tellen stappen gelijk mee; dit is geen geldbedrag en geen genezingspercentage.
                translate: false
          medical_done_amount:
            label: Bevestigd bedrag bij Al gedaan (optioneel)
            type: number
            min: 0
            step: 1
            before: €
            translate: false
          medical_planned_amount:
            label: Bevestigd bedrag bij Nog te doen (optioneel)
            type: number
            min: 0
            step: 1
            before: €
            translate: false
          updates_title:
            label: Titel updates
            type: text
      sidebar:
        width: 1/3
        fields:
          treatment_image:
            label: Foto bij het traject (optioneel)
            type: files
            multiple: false
            uploads: image
            translate: false
  contact:
    label: Contact
    fields:
      contact_kicker:
        label: Bovenschrift
        type: text
      contact_title:
        label: Titel
        type: text
      contact_text:
        label: Intro
        type: textarea
  meta:
    label: Menu & zoekmachines
    fields:
      navtitle:
        label: Naam in het menu
        type: text
      description:
        label: Beschrijving voor zoekmachines
        type: textarea
