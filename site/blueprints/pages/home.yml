title: Home
options:
  changeStatus: false
  delete: false
tabs:
  hero:
    label: Hero
    columns:
      main:
        width: 2/3
        fields:
          hero_kicker:
            label: Bovenschrift
            type: text
          hero_title:
            label: Hoofdtitel
            type: text
          hero_text:
            label: Intro onder de hoofdtitel
            type: textarea
      sidebar:
        width: 1/3
        fields:
          hero_image:
            label: Foto
            type: files
            multiple: false
            uploads: image
            translate: false
  story:
    label: Over Tess
    columns:
      main:
        width: 2/3
        fields:
          story_title:
            label: Titel
            type: text
          story_text:
            label: Tekst
            type: textarea
            size: large
      sidebar:
        width: 1/3
        fields:
          story_image:
            label: Foto
            type: files
            multiple: false
            uploads: image
            translate: false
  donate:
    label: Doneren
    fields:
      progress_title:
        label: Titel boven de voortgangsbalk
        type: text
        help: Bedragen en mijlpalen staan bij Site-instellingen.
      donation_title:
        label: Titel donatieblok
        type: text
      donation_text:
        label: Tekst donatieblok
        type: textarea
  contribute:
    label: Bijdragen
    fields:
      contribute_title:
        label: Titel
        type: text
      contribute_cards:
        label: Kaarten
        type: structure
        columns:
          title: true
          action: true
        fields:
          action:
            label: Actie bij klikken
            type: select
            required: true
            options:
              donate: Naar het donatieblok
              share: Pagina delen
              contact: Naar het contactformulier
          title:
            label: Titel
            type: text
          text:
            label: Tekst
            type: text
  treatment:
    label: Updates & traject
    columns:
      main:
        width: 2/3
        fields:
          updates_title:
            label: Titel updates
            type: text
          treatment_title:
            label: Titel traject
            type: text
          treatment_steps:
            label: Stappen
            type: structure
            fields:
              heading:
                label: Stap
                type: text
      sidebar:
        width: 1/3
        fields:
          treatment_image:
            label: Foto bij het traject
            type: files
            multiple: false
            uploads: image
            translate: false
  contact:
    label: Contact
    fields:
      contact_kicker:
        label: Bovenschrift
        type: text
      contact_title:
        label: Titel
        type: text
      contact_text:
        label: Intro
        type: textarea
  meta:
    label: Menu & zoekmachines
    fields:
      navtitle:
        label: Naam in het menu
        type: text
      description:
        label: Beschrijving voor zoekmachines
        type: textarea
