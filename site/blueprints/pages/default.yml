title: Inhoudspagina
columns:
  main:
    width: 2/3
    fields:
      footerlabel:
        label: Naam in de footer (optioneel)
        type: text
      navtitle:
        label: Naam in het menu
        type: text
      heading:
        label: Paginakop (optioneel)
        type: text
      description:
        label: Beschrijving voor zoekmachines
        type: textarea
      text:
        label: Introductie
        type: textarea
        size: large
      sections:
        label: Tekstonderdelen
        type: structure
        help: Elk onderdeel kan een eigen foto krijgen. Zonder foto wordt de tekst op volle breedte getoond.
        columns:
          heading: true
          image: true
        fields:
          heading:
            label: Tussentitel
            type: text
          text:
            label: Tekst
            type: textarea
            size: large
          image:
            label: Foto (optioneel)
            type: files
            multiple: false
            uploads: image
            width: 1/2
          imageposition:
            label: Plaats van de foto
            type: select
            default: auto
            width: 1/2
            options:
              auto: Automatisch afwisselen
              right: Rechts van de tekst
              left: Links van de tekst
            help: Op de gsm staat de foto altijd boven de tekst.
          caption:
            label: Onderschrift bij de foto (optioneel)
            type: text
      steps_title:
        label: Titel boven de stappen
        type: text
      steps_intro:
        label: Inleiding bij de stappen (optioneel)
        type: textarea
      steps:
        label: Stappen behandeltraject (optioneel)
        type: structure
        help: De stappen van Ziekte & behandeling staan ook als tijdlijn op de homepage, met titel en status. Met de status zie je daar waar Tess nu staat.
        columns:
          heading: true
          status: true
        fields:
          heading:
            label: Stap
            type: text
          status:
            label: Status op de homepage (optioneel)
            type: select
            options:
              done: Afgerond
              current: Nu bezig
              upcoming: Nog te komen
          text:
            label: Toelichting
            type: textarea
      accordiontitle:
        label: Titel van uitklapbare onderdelen
        type: text
      accordionintro:
        label: Uitleg bij de uitklapbare onderdelen
        type: textarea
      questions:
        label: Vragen of uitklapbare onderdelen
        type: structure
        fields:
          question:
            label: Vraag of titel
            type: text
          answer:
            label: Antwoord
            type: textarea
  sidebar:
    width: 1/3
    fields:
      cover:
        label: Introductiefoto (optioneel)
        help: Wordt breed onder de introductie getoond.
        type: files
        multiple: false
        uploads: image
        translate: false
    sections:
      files:
        type: files
