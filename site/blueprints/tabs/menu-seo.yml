# How a page is named in the menu and footer, and described to search engines.
label: Menu & zoekmachines
icon: search
fields:
  navtitle:
    label: Naam in het menu
    type: text
    width: 1/2
  footerlabel:
    label: Naam in de footer (optioneel)
    type: text
    width: 1/2
    help: Leeg = zelfde als in het menu.
  seotitle:
    label: Titel in Google (optioneel)
    type: text
    counter: true
    maxlength: 70
    help: De blauwe titel in de zoekresultaten. Leeg = de paginatitel met "| Samen voor Tess" erachter (op de homepage "Samen voor Tess – " met de websitebeschrijving).
  description:
    label: Beschrijving voor zoekmachines
    type: textarea
    help: Het grijze tekstje onder de titel in Google, liefst 120 à 160 tekens. Leeg = het begin van de introductie, en anders de websitebeschrijving uit Instellingen.
  shareimage:
    label: Deelafbeelding (optioneel)
    type: files
    multiple: false
    uploads: image
    translate: false
    help: Het voorbeeld bij delen via WhatsApp, Facebook of Instagram. Liefst 1200 × 630 pixels. Leeg = de standaard deelafbeelding uit Instellingen.
