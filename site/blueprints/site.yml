title: Samen voor Tess
tabs:
  pages:
    label: Pagina's
    sections:
      pages:
        type: pages
  updates:
    label: Updates
    icon: megaphone
    sections:
      updates:
        type: pages
        headline: Updates
        parent: site.find("updates")
        template: update
        status: all
        sortBy: date desc
        layout: cards
        size: small
        empty: Nog geen updates. Klik op "Toevoegen" om de eerste te maken.
        info: "{{ page.date.toDate('d-m-Y') }}"
        image:
          query: page.photos.toFile
          cover: true
          ratio: 4/3
  donations:
    label: Donaties
    icon: heart
    fields:
      goal:
        label: Doelbedrag
        type: number
        min: 0
        step: 1
        before: €
        help: Laat leeg zolang er geen bevestigd doelbedrag is. Dan toont de site een gemarkeerde voorbeeldbalk.
        translate: false
      raised_info:
        label: Opgehaald
        type: info
        text: Vul per bron het opgehaalde bedrag in. De site telt ze op en berekent het percentage automatisch.
      raised_steunactie:
        label: Externe steunactie
        type: number
        min: 0
        step: 1
        before: €
        width: 1/3
        translate: false
      raised_gofundme:
        label: GoFundMe
        type: number
        min: 0
        step: 1
        before: €
        width: 1/3
        translate: false
      raised_other:
        label: Overschrijvingen en andere giften
        type: number
        min: 0
        step: 1
        before: €
        width: 1/3
        translate: false
      milestones:
        label: Mijlpalen onder de voortgangsbalk
        type: structure
        sortBy: amount asc
        columns:
          amount: true
          label: true
        fields:
          amount:
            label: Bedrag
            type: number
            min: 0
            step: 1
            before: €
            required: true
          label:
            label: Omschrijving
            type: text
  texts:
    label: Teksten
    fields:
      cta_title:
        label: Titel oproepblok onderaan pagina's
        type: text
      cta_text:
        label: Tekst oproepblok
        type: text
      footer_tagline:
        label: Slogan in de footer
        type: text
  settings:
    label: Site-instellingen
    fields:
      description:
        label: Websitebeschrijving
        type: textarea
      logo:
        label: Huidig logo
        type: files
        multiple: false
        query: site.files
        uploads: image
        translate: false
      organisation:
        label: Organisatie
        type: text
      organisationdetails:
        label: Adres, ondernemingsnummer en rekeninggegevens
        type: textarea
      contactemail:
        label: Contactadres
        type: email
        translate: false
      instagram:
        label: Instagram Samen voor Tess (volledige URL)
        type: url
        translate: false
      instagramtess:
        label: Instagram Tess (volledige URL)
        type: url
        translate: false
      bankaccount:
        label: Rekeningnummer voor overschrijvingen
        type: text
        help: Wordt bij Help Tess en in de footer getoond.
        translate: false
      fundraiser:
        label: Externe steunactie (optioneel)
        type: url
        help: Alleen een bevestigde URL invullen. Dit is geen betaalintegratie.
        translate: false
    sections:
      files:
        label: Logo en sitebestanden
        type: files
